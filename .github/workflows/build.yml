name: Build native pet plugin
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: ./build.ps1
      - shell: pwsh
        run: dotnet run --project native-tests/CodexPetPlugin.Tests.csproj -c Release
      - shell: pwsh
        run: ./tests/mcp-smoke.ps1
      - shell: pwsh
        run: ./tests/ui-smoke.ps1
      - shell: pwsh
        run: ./package.ps1 -ReuseBuild
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
