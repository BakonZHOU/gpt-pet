name: Build MCP App
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - shell: pwsh
        run: ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256