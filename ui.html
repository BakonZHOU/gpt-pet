<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>额度伙伴</title><style>
:root{--ink:#77668f;--outline:#534264;--hint:#a59ab8;--fill:#f8f3fc;--breath:4.4s;--hair:2.8s;--amp:1;--hairamp:1}*{box-sizing:border-box}body{margin:0;overflow:hidden;font:13px 'Segoe UI','Microsoft YaHei UI',sans-serif;color:var(--ink);background:transparent}button,select,textarea,input{font:inherit}button{cursor:pointer}header{height:42px;display:flex;align-items:center;padding:0 14px;gap:8px;border-bottom:1px solid color-mix(in srgb,var(--hint) 25%,transparent)}header strong{font-size:13px;font-weight:600;color:var(--outline)}header button{background:transparent;border:0;color:var(--ink);padding:5px}header span{flex:1}#status{font-size:11px;color:var(--hint)}#board{position:relative;width:100%;height:100dvh;min-height:0;overflow:hidden}#pet{position:absolute;width:200px;height:200px;transform-origin:center;touch-action:none;user-select:none}#pet.mirror{transform:scaleX(-1)}#pet.mirror #words{transform:scaleX(-1)}#character{position:absolute;right:0;bottom:0;width:59.45%;height:59.45%;padding:0;border:0;background:transparent;touch-action:none;cursor:grab}#character:active{cursor:grabbing}#character.pressed{transform:scale(1.05,.88);transform-origin:50% 100%}#drawing{width:100%;height:100%;overflow:visible}#breathing{transform-origin:305px 610px;animation:breathe var(--breath) ease-in-out infinite}#hair{animation:hair var(--hair) ease-in-out infinite}#bubble{position:absolute;left:0;top:0;width:100%;height:68.23%;cursor:pointer}#bubble[hidden]{display:none}#cloud{width:100%;height:100%;overflow:visible}.bubble-shape{fill:var(--fill);stroke:var(--outline);stroke-width:18px;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}#words{position:absolute;left:4%;top:10%;width:80.5%;height:58%;display:flex;flex-direction:column;justify-content:center;text-align:center;pointer-events:none;color:var(--ink)}#label{font-weight:600;line-height:1.1;font-size:12.86px}#amount{font-size:24.95px;font-weight:800;line-height:1.05}#hint{font-size:10.92px;line-height:1.15;color:var(--hint);margin-top:2px}#words.quote #amount{font-size:12.86px;font-weight:600;line-height:1.15;white-space:normal;overflow-wrap:anywhere}#words.quote.short #amount{font-size:24.95px;font-weight:800}.pop .dot-low{animation:pop .2s both}.pop .dot-high{animation:pop .2s .13s both}.pop .cloud-main{animation:pop .2s .26s both}.pop #words{animation:appear .16s .36s both}#empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--hint)}#empty[hidden]{display:none}#settings{position:fixed;z-index:9;top:44px;right:8px;width:min(224px,calc(100vw - 16px));max-height:calc(100vh - 52px);overflow:auto;padding:14px;background:var(--fill);border:1px solid var(--hint);border-radius:10px;box-shadow:0 8px 24px #0002;color:var(--outline)}#settings[hidden]{display:none}.row{display:flex;align-items:center;gap:4px;margin:8px 0}.row>span{min-width:57px;font-size:12px}.row input[type=range]{min-width:0;flex:1;accent-color:var(--ink)}.row output{width:42px;text-align:right;font-size:11px}.row select{flex:1;min-width:0;color:var(--outline);background:var(--fill);border:1px solid var(--hint);border-radius:5px;padding:4px}textarea{width:100%;min-height:120px;resize:vertical;color:var(--outline);background:transparent;border:1px solid var(--hint);border-radius:5px;padding:7px}#settings button{padding:6px 9px;margin:5px 3px 0 0;border:1px solid var(--hint);border-radius:6px;background:transparent;color:var(--outline)}#settings details{margin-top:10px}#reset-info{font-size:12px;line-height:1.6;white-space:pre-wrap;color:var(--ink)}.still #breathing,.still #hair,.still .bubble-shape,.still #words{animation:none!important}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(calc(1 + .02 * var(--amp)),calc(1 + .045 * var(--amp)))}}@keyframes hair{0%,100%{transform:rotate(0deg)}18%{transform:rotate(calc(-7deg * var(--hairamp)))}38%{transform:rotate(calc(2.5deg * var(--hairamp)))}58%{transform:rotate(calc(5.5deg * var(--hairamp)))}80%{transform:rotate(calc(-1.5deg * var(--hairamp)))}}@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}@keyframes appear{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
dialog{width:min(420px,calc(100vw - 24px));border:1px solid var(--hint);border-radius:10px;color:var(--outline);background:var(--fill)}dialog::backdrop{background:#0003}dialog button{padding:5px 12px;margin-right:8px;color:var(--outline);border:1px solid var(--hint);border-radius:5px;background:transparent}#settings>button{display:block;width:100%;border:0;border-radius:0;padding:5px 0;margin:0;text-align:center;font-size:12px}#settings>button:hover{background:color-mix(in srgb,var(--hint) 15%,transparent)}#settings #status{display:block;margin-top:6px;font-size:10px}#settings>button[hidden],#audio-status[hidden]{display:none}#audio-status{display:block;color:var(--ink);font-size:10px;margin-top:6px}</style></head><body><main id="board"><div id="empty" hidden><span id="empty-message"></span><button id="show" hidden>显示桌宠</button></div><div id="pet"><button id="character" aria-label="额度伙伴，点击查看额度"><svg id="drawing" viewBox="0 0 610 610"><defs><clipPath id="body-clip"><path id="body-path" clip-rule="evenodd"/></clipPath><clipPath id="hair-clip"><rect id="hair-rect"/></clipPath></defs><g id="breathing"><image id="body-image" width="610" height="610" clip-path="url(#body-clip)"/><g id="hair"><image id="hair-image" width="610" height="610" clip-path="url(#hair-clip)"/></g></g></svg></button><div id="bubble" hidden role="button" tabindex="0" aria-label="气泡，点击切换"><svg id="cloud" viewBox="0 0 1026 700"><path class="bubble-shape cloud-main" d="M827 248 A373 232 0 1 0 81 246 A373 232 0 0 0 301 465 A57 32 10 0 0 413 484 A373 232 0 0 0 827 248Z"/><ellipse class="bubble-shape dot-high" cx="352" cy="561" rx="37.5" ry="26"/><ellipse class="bubble-shape dot-low" cx="442" cy="646" rx="24.5" ry="18"/></svg><div id="words"><div id="label"></div><div id="amount"></div><div id="hint"></div></div></div></div></main><aside id="settings" hidden>
<div class="row"><span>皮肤</span><select id="skin"><option value="whale">鲸鱼娘 · 原版</option><option value="mutsumi">若叶睦 · 浅绿</option><option value="dragon">GPT娘 · 白龙</option></select></div>
<div id="sliders"></div>
<div class="row"><span>音效</span><select id="soundSet"><option value="duck">小黄鸭</option><option value="fx1">音效1</option></select></div>
<div id="volume-slot"></div>
<div class="row"><label><input id="bubbles" type="checkbox"> 气泡</label></div>
<div class="row" title="GPT应用内面板的置顶由宿主管理，官方插件接口未开放"><label><input id="topmost" type="checkbox" disabled> 置顶显示（宿主管理）</label></div>
<div id="quote-slot"></div>
<button id="pip" hidden>悬浮显示（画中画）</button><button id="edit-quotes">编辑语录</button><button id="hide">隐藏桌宠</button><button id="reset">重置时间</button><button id="exit">退出</button>
<small id="audio-status" role="status" hidden></small><small id="status" role="status">连接中…</small>
</aside>
<dialog id="quote-editor"><form method="dialog"><strong>编辑语录</strong><p>每行一句，# 开头的行不显示。</p><textarea id="quotes" aria-label="语录，每行一句"></textarea><p id="quote-error" role="status"></p><button id="save-quotes" type="button">保存</button><button id="cancel-quotes" type="button">取消</button></form></dialog><script>window.PET_ASSETS=/*__ASSETS__*/;</script><script>/*__BUNDLE__*/</script></body></html>
